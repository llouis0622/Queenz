name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 퍼즐 데이터 검증
        run: node scripts/validate.mjs data/puzzles.json
      - name: 빌드 (서비스 워커 버전 주입)
        run: |
          mkdir -p dist
          cp -r index.html manifest.webmanifest sw.js css js data icons .nojekyll dist/
          sed -i "s/__BUILD__/${GITHUB_SHA::10}/" dist/sw.js
          grep -q "${GITHUB_SHA::10}" dist/sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # github-pages 환경 보호 규칙(기본 브랜치 고정)에 걸리지 않도록 environment 선언 없이 배포
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
